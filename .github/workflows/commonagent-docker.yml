# CommonAgent image build — pushes to GHCR on every push to main.
# Simpler than upstream docker.yml (single amd64 arch, no Docker Hub,
# no protected environments) because this fork only deploys one GCE VM.
name: CommonAgent Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "website/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: commonagent-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/commonagent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=commonagent-amd64
          cache-to: type=gha,mode=max,scope=commonagent-amd64
